name: Build desktop & mobile packages

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: packages-${{ github.ref }}
  cancel-in-progress: false

# Cloud sync is compiled into the frontend at build time, so these must be set
# for every packaging job and for verify-and-publish's reference build: one
# missing job would produce a package whose embedded frontend no longer matches
# the reference hash. Public values by design (the anon key ships inside each
# installer), hence repository variables rather than secrets. Empty means an
# offline-only build, which verify-and-publish refuses for a release tag.
env:
  VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
  VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}

jobs:
  # ── Windows NSIS installer (+ updater artifacts) ────────────────────
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      # Pins SOURCE_DATE_EPOCH (commit time, not the runner clock), TZ, locale
      # and the Rust path remapping, so rebuilding this tag reproduces the same
      # bytes. See docs/reproducible-builds.md.
      - name: Pin reproducible build environment
        shell: bash
        run: source scripts/repro-env.sh

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Check release version
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$version") {
            throw "Release tag must match package.json version (v$version)."
          }
          # Windows runners check files out with CRLF (core.autocrlf), so
          # the line-end must tolerate an optional \r or the check false-fails.
          $cargo = Get-Content src-tauri/Cargo.toml -Raw
          if ($cargo -notmatch ('(?m)^version = "' + [regex]::Escape($version) + '"\r?$')) {
            throw 'Cargo.toml version must match package.json.'
          }

      - name: Build and publish Windows installer
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the update bundle (.sig) for the in-app updater. The public
          # half is embedded in the app (tauri.conf.json plugins.updater.pubkey).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Dental Canvas ${{ github.ref_name }}
          releaseBody: |
            Download the Dental Canvas installer for your platform below.

            - **Windows** — `...-setup.exe` (NSIS installer, x64)
            - **Linux** — `..._amd64.deb`, `..._x86_64.rpm`, `..._amd64.AppImage`
            - **macOS** — `..._aarch64.appdmg` (Apple Silicon) — unsigned: right-click → Open on first launch
            - **Android** — `...-universal.apk` (sideload; enable "install unknown apps")

            These releases package the full offline app — UI and the local backend are both bundled, so the clinic can run entirely without internet. Installers are not code-signed.

            See README.md for setup and limitations.
          # Draft until the verify-and-publish job has checked every package's
          # embedded frontend; it flips the release live on success.
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          # Generate latest.json for the in-app updater (endpoints in
          # tauri.conf.json point at releases/latest/download/latest.json) and
          # prefer the NSIS setup.exe (the only bundle we ship) as the payload.
          updaterJsonPreferNsis: true
          args: --target x86_64-pc-windows-msvc --bundles nsis

  # ── Linux desktop packages (deb / rpm / AppImage) ───────────────────
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Pin reproducible build environment
        run: source scripts/repro-env.sh

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      # libayatana-appindicator3-dev conflicts with the legacy
      # libappindicator3-dev — only the ayatana one may be installed.
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev libgtk-3-dev

      - name: Check release version
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version v$version" >&2
            exit 1
          fi

      - name: Build Linux packages
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Dental Canvas ${{ github.ref_name }}
          releaseBody: |
            Linux desktop packages. `.deb` for Debian/Ubuntu, `.rpm` for
            Fedora/openSUSE, `.AppImage` for everything else.
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          args: --bundles deb,rpm,appimage

  # ── macOS DMG (Apple Silicon) ───────────────────────────────────────
  # Unsigned DMG for now — macOS Gatekeeper requires right-click → Open
  # (or xattr -cr) on first launch. Ad-hoc signing keeps the binary valid
  # locally; a Developer ID certificate can be added later for notarization.
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Pin reproducible build environment
        run: source scripts/repro-env.sh

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Check release version
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version v$version" >&2
            exit 1
          fi

      - name: Build and publish macOS DMG
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Dental Canvas ${{ github.ref_name }}
          releaseBody: |
            macOS DMG (Apple Silicon). Unsigned — on first launch right-click
            the app and choose Open, or run `xattr -cr /Applications/Dental\ Canvas.app`.
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          args: --target aarch64-apple-darwin --bundles dmg

  # ── Android APK ─────────────────────────────────────────────────────
  # Produces a SIGNED universal APK for sideloading on tablets/phones.
  # GitHub runners ship the Android SDK + NDK preinstalled; tauri android
  # init generates the Gradle project. Signing uses TAURI_ANDROID_KEYSTORE
  # (base64 .jks) + TAURI_ANDROID_KEYSTORE_PASSWORD + TAURI_ANDROID_KEY_ALIAS
  # secrets when present; otherwise a throwaway release keystore is generated
  # in-workflow (fine for sideloading — just not for Play Store updates).
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Pin reproducible build environment
        run: source scripts/repro-env.sh

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Rust Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Locate Android SDK / NDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          ndk=$(ls -d "$ANDROID_HOME"/ndk/* | sort -V | tail -1)
          echo "NDK_HOME=$ndk" >> "$GITHUB_ENV"

      - name: Initialize Android project
        run: pnpm tauri android init || true

      - name: Configure signing
        env:
          KS_B64: ${{ secrets.TAURI_ANDROID_KEYSTORE }}
          KS_PASS: ${{ secrets.TAURI_ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.TAURI_ANDROID_KEY_ALIAS }}
        run: |
          # No ephemeral fallback: a release signed with a throwaway per-run
          # key can never update over a previous one on devices (signature
          # mismatch). Missing secrets must fail the build loudly.
          if [ -z "$KS_B64" ] || [ -z "$KS_PASS" ] || [ -z "$KS_ALIAS" ]; then
            echo "::error::Android signing secrets missing. Set TAURI_ANDROID_KEYSTORE (base64 .jks), TAURI_ANDROID_KEYSTORE_PASSWORD and TAURI_ANDROID_KEY_ALIAS — without them devices cannot install updates over an existing app."
            exit 1
          fi
          echo "$KS_B64" | base64 -d > keystore.jks
          alias="$KS_ALIAS"
          pass="$KS_PASS"
          # Sanity-check the keystore actually decodes and opens with the
          # given password before the build burns ten minutes on it.
          keytool -list -keystore keystore.jks -storepass "$pass" -alias "$alias" >/dev/null \
            || { echo "::error::TAURI_ANDROID_KEYSTORE did not open with TAURI_ANDROID_KEYSTORE_PASSWORD / alias not found"; exit 1; }
          echo "signing=secret-keystore" >> "$GITHUB_ENV"
          # keystore.properties at the ANDROID PROJECT ROOT, with the exact
          # keys the official Tauri signing flow expects.
          cat > src-tauri/gen/android/keystore.properties <<EOF
          password=$pass
          keyAlias=$alias
          storeFile=${GITHUB_WORKSPACE}/keystore.jks
          EOF

      # Wire the signing config into build.gradle.kts per the official Tauri
      # Android signing guide: imports at the very TOP of the file (the only
      # legal position), a release signingConfigs block before buildTypes, and
      # signingConfig set inside buildTypes.release. Every replacement asserts
      # so a silent no-match can never produce an unsigned APK again.
      - name: Wire signing into the Gradle project
        run: |
          python3 - <<'PY'
          import re, sys
          p = "src-tauri/gen/android/app/build.gradle.kts"
          s = open(p).read()
          marker = "dental-canvas-ci-signing"
          if marker in s:
            print("already wired")
            sys.exit(0)
          # The template already imports Properties but not FileInputStream —
          # ensure each import individually (imports must sit above all
          # declarations; prepending to the file top is always valid).
          for imp in ("import java.util.Properties", "import java.io.FileInputStream"):
            if imp not in s:
              s = imp + "\n" + s
          block = '''// dental-canvas-ci-signing
          signingConfigs {
              create("release") {
                  val keystorePropertiesFile = rootProject.file("keystore.properties")
                  val keystoreProperties = Properties()
                  if (keystorePropertiesFile.exists()) {
                      keystoreProperties.load(FileInputStream(keystorePropertiesFile))
                  }
                  keyAlias = keystoreProperties["keyAlias"] as String
                  keyPassword = keystoreProperties["password"] as String
                  storeFile = file(keystoreProperties["storeFile"] as String)
                  storePassword = keystoreProperties["password"] as String
              }
          }

          '''
          s2 = s.replace("buildTypes {", block + "buildTypes {", 1)
          assert s2 != s, "buildTypes block not found in build.gradle.kts"
          s = s2
          # Match `getByName("release") {` directly — the buildTypes-wide
          # regex could not cross the debug block's closing brace. Asserts
          # the one release build type exists and injects into it.
          s2, n = re.subn(
            r"""getByName\((?:'|\")release(?:'|\")\)\s*\{""",
            'getByName("release") {\\n            signingConfig = signingConfigs.getByName("release")',
            s,
            count=1,
          )
          assert n == 1, "buildTypes.release block not found in build.gradle.kts"
          open(p, "w").write(s2)
          print("signing wired with assertions")
          PY

      - name: Build Android APK (signed)
        run: pnpm tauri android build --apk

      - name: Rename the signed APK
        run: |
          cd src-tauri/gen/android/app/build/outputs/apk/universal/release
          for f in *-unsigned.apk; do
            [ -e "$f" ] || continue
            mv "$f" "${f/-unsigned/}"
          done
          ls -la

      - name: Verify the APK is signed
        run: |
          apk=$(ls src-tauri/gen/android/app/build/outputs/apk/universal/release/*.apk | head -1)
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
          if [ -z "$apksigner" ]; then echo "apksigner not found" >&2; exit 1; fi
          "$apksigner" verify --print-certs "$apk"
          # Belt and braces: an APK without the v2/v3 signing block cannot
          # install on modern Android regardless of what apksigner says.
          python3 -c "
          import sys
          data = open(sys.argv[1], 'rb').read()
          sys.exit(0 if b'APK Sig Block 42' in data else 1)
          " "$apk"
          echo "signature block verified"

      # Plain asset upload to the release the Windows job created — avoids
      # action-gh-release's update-release flow, which the GITHUB_TOKEN may
      # not be allowed to perform on existing releases.
      - name: Upload APK to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" \
            src-tauri/gen/android/app/build/outputs/apk/universal/release/*.apk \
            --clobber --repo "${GITHUB_REPOSITORY}"

  # ── Android boot smoke test ─────────────────────────────────────────
  # The v1.4.11 APK installed fine but EVERY boot died in the service-worker
  # path — no package inspection can catch that, only launching the app can.
  # This job builds a debug APK, boots an emulator, and runs the in-tree
  # instrumented test (tests/android) asserting the WebView mounts past
  # boot (not the "could not start" fatal screen). The verify-and-publish
  # job waits for it, so a non-booting APK can never ship.
  android-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Rust Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Locate Android SDK / NDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          ndk=$(ls -d "$ANDROID_HOME"/ndk/* | sort -V | tail -1)
          echo "NDK_HOME=$ndk" >> "$GITHUB_ENV"

      - name: Initialize Android project
        run: pnpm tauri android init || true

      # The Gradle project is generated by `tauri android init` (gitignored),
      # so the in-tree test source + its dependencies are injected here.
      # The Tauri template does NOT set testInstrumentationRunner, so the
      # test APK registers android.test.InstrumentationTestRunner and
      # `am instrument -e class ... AndroidJUnitRunner` fails — set it.
      - name: Inject the boot smoke test into the Gradle project
        run: |
          set -e
          app=src-tauri/gen/android/app
          mkdir -p "$app/src/androidTest/java/com/dentalcanvas/app"
          cp tests/android/src/androidTest/java/com/dentalcanvas/app/BootSmokeTest.kt \
             "$app/src/androidTest/java/com/dentalcanvas/app/BootSmokeTest.kt"
          python3 - <<'PY'
          p = "src-tauri/gen/android/app/build.gradle.kts"
          s = open(p).read()
          changed = False
          marker = "dental-canvas-boot-smoke-deps"
          if marker not in s:
              block = '''// dental-canvas-boot-smoke-deps
              androidTestImplementation("androidx.test.ext:junit:1.2.1")
              androidTestImplementation("androidx.test.uiautomator:uiautomator:2.3.0")
              androidTestImplementation("androidx.test:runner:1.6.2")
              '''
              anchor = "dependencies {"
              assert anchor in s, "dependencies block not found in build.gradle.kts"
              s = s.replace(anchor, anchor + "\n" + block, 1)
              changed = True
              print("smoke deps injected")
          else:
              print("already injected")
          runner_line = 'testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"'
          if runner_line not in s:
              anchor = "defaultConfig {"
              assert anchor in s, "defaultConfig block not found in build.gradle.kts"
              s = s.replace(anchor, anchor + "\n            " + runner_line, 1)
              changed = True
              print("test runner injected")
          else:
              print("test runner already set")
          if changed:
              open(p, "w").write(s)
          PY

      - name: Build debug APK (with tests)
        run: pnpm tauri android build --debug --apk

      # tauri android build only produces the app APK; the instrumented-test
      # APK is a separate Gradle output that must be built (and installed)
      # explicitly, or `am instrument` fails with INSTRUMENTATION_FAILED.
      # rustBuild*Debug are excluded: they shell back out to the tauri CLI
      # daemon, which has exited by then (WebSocket ConnectionRefused), and
      # the native libs were already produced by the tauri build above (the
      # universal build covers all ABIs, so each task's output is present).
      - name: Build the androidTest APK
        working-directory: src-tauri/gen/android
        run: |
          ./gradlew assembleUniversalDebugAndroidTest \
            -x rustBuildArm64Debug -x rustBuildArmDebug \
            -x rustBuildX86Debug -x rustBuildX86_64Debug

      # Without this the runner user cannot open /dev/kvm, and the emulator
      # falls back to pure software emulation: boot took 394 s and adb stayed
      # flaky ("device offline" / "Broken pipe") until the job timed out.
      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          [ -e /dev/kvm ] && echo "KVM available" || { echo "::error::/dev/kvm not present"; exit 1; }

      - name: Run boot smoke test on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          # hw-accel must stay ON (KVM); software accel is what wedged the
          # previous run.
          disable-linux-hw-accel: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          # NOTE: this action executes EACH LINE of `script` via a separate
          # `sh -c`, so shell variables do not survive across lines. Use
          # single-line commands (or && chains) only.
          script: |
            adb install -r src-tauri/gen/android/app/build/outputs/apk/universal/debug/app-universal-debug.apk
            adb install -r src-tauri/gen/android/app/build/outputs/apk/androidTest/universal/debug/app-universal-debug-androidTest.apk
            adb shell pm list instrumentation | grep dentalcanvas || true
            adb shell am instrument -w -e class com.dentalcanvas.app.BootSmokeTest com.dentalcanvas.app.test/androidx.test.runner.AndroidJUnitRunner

      - name: Collect diagnostics on failure
        if: failure()
        run: |
          adb logcat -d > boot-smoke-logcat.txt || true
          adb shell uiautomator dump /sdcard/window_dump.xml >/dev/null 2>&1 || true
          adb pull /sdcard/window_dump.xml . >/dev/null 2>&1 || true
          ls -la

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: boot-smoke-diagnostics
          path: |
            boot-smoke-logcat.txt
            window_dump.xml
          if-no-files-found: ignore

  # ── Verify & publish ────────────────────────────────────────────────────────────
  # The stale-UI incident (v1.4.4: an installer that silently shipped an old
  # frontend) is only catchable by opening the packages and comparing. Every
  # build job above creates a DRAFT release; this job extracts each desktop
  # package and asserts the embedded frontend hashes match a fresh build of
  # the tagged commit, then flips the release live. A bad package can never
  # reach users.
  verify-and-publish:
    runs-on: ubuntu-latest
    needs: [build-windows, build-linux, build-macos, build-android, android-smoke]
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # binutils provides ar, p7zip-full provides 7z — both are shellouts of
      # scripts/verify_embedded_frontend.py.
      - name: Install extraction tools
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full binutils

      - name: Pin reproducible build environment
        run: source scripts/repro-env.sh

      # The embedded-frontend check compares the packages against the build
      # below, so a missing variable would make an offline-only release agree
      # with itself and ship silently. Refuse that here instead.
      - name: Cloud sync credentials are configured
        env:
          URL: ${{ vars.VITE_SUPABASE_URL }}
          KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "::error::VITE_SUPABASE_URL / VITE_SUPABASE_ANON_KEY repository variables are empty, so this tag would ship with cloud sync disabled. Set both under Settings → Secrets and variables → Actions → Variables, then re-run this workflow."
            exit 1
          fi
          echo "cloud sync configured for $URL"

      # Built with the pinned environment above, so this dist/ is the reference
      # every package is checked against and its manifest is published with
      # the release for developers to compare against.
      - name: Build the reference frontend
        run: |
          npm run build
          echo "Reference build entry chunk: $(grep -o 'index-[A-Za-z0-9_-]*\.js' dist/index.html | head -1)"
          node scripts/build-manifest.mjs dist --out repro-manifest.json --label "${{ runner.os }}-${{ runner.arch }}"

      # Proves the values reached Vite instead of being configured but unused.
      - name: The reference build contains the Supabase project
        env:
          URL: ${{ vars.VITE_SUPABASE_URL }}
        run: |
          host=${URL#https://}
          host=${host%/}
          if ! grep -rqF "$host" dist/assets; then
            echo "::error::dist/ does not contain $host, so cloud sync was not compiled into this build."
            exit 1
          fi
          echo "cloud sync compiled into dist/: $host"

      # The manifest published below is only useful if rebuilding this tag
      # reproduces it, so prove that here too: a second build of the same commit
      # must match the reference dist/ byte for byte.
      - name: Assert the reference frontend rebuilds identically
        run: node scripts/repro-build.mjs --baseline dist

      - name: Download all release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p verify
          # `--pattern` is mandatory: a plain `gh release download` only fetches a
          # subset of assets on this client, which silently drops the Windows
          # installer and signature files. Every package type (and every .sig for
          # the updater verification) must be present before the scan.
          gh release download "${GITHUB_REF_NAME}" --dir verify --clobber \
            --pattern "*.exe" --pattern "*.sig" --pattern "*.dmg" \
            --pattern "*.AppImage" --pattern "*.deb" --pattern "*.rpm" \
            --pattern "*.apk" --pattern "*.json" \
            --repo "${GITHUB_REPOSITORY}"
          ls -la verify

      - name: Verify embedded frontend in every published package
        run: |
          python3 scripts/verify_embedded_frontend.py \
            --dist dist \
            --package verify/*-setup.exe \
            --package verify/*.deb \
            --package verify/*.rpm \
            --package verify/*.AppImage \
            --package verify/*.dmg \
            --package verify/*.apk

      - name: Verify updater feed
        env:
          EXPECTED_VERSION: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import json, os
          with open("verify/latest.json") as f:
              feed = json.load(f)
          version = os.environ["EXPECTED_VERSION"].lstrip("v")
          assert feed["version"] == version, f"latest.json version {feed['version']} != {version}"
          for plat in ("windows-x86_64", "linux-x86_64"):
              assert plat in feed["platforms"], f"latest.json missing {plat}"
              assert "signature" in feed["platforms"][plat], f"{plat} missing updater signature"
          print("latest.json OK:", feed["version"], sorted(feed["platforms"]))
          PY

      # The repo's scripts/stylesheet-classes.txt is the class set the build is
      # *expected* to produce; this is the set the packages above actually
      # contain. Regenerate it from the reference dist/ — the same bytes every
      # package was just verified against — so the release carries a baseline
      # that is derived from shipped CSS instead of hand-maintained, and fail if
      # the two disagree: that would mean the tag ships classes the repo does
      # not claim, which the per-commit guard in `pnpm run build` cannot have
      # seen (e.g. a guard bypassed by building with plain `vite build`).
      - name: Refresh the stylesheet class snapshot from the shipped build
        run: |
          set -eu
          node scripts/check-stylesheet-classes.mjs --write \
            --file verify/stylesheet-classes.txt \
            --note "shipped in ${GITHUB_REF_NAME} (reference build)"
          # Tags cut before the guard existed have no snapshot to compare with;
          # the regenerated one above is still worth publishing for them.
          if [ ! -f scripts/stylesheet-classes.txt ]; then
            echo "::warning::${GITHUB_REF_NAME} predates scripts/stylesheet-classes.txt; publishing the regenerated snapshot without a comparison."
            exit 0
          fi
          # Compare class sets only, not bytes: the header's `# source:` line
          # differs by design (a branch tip locally, the tag here).
          grep -v '^#' scripts/stylesheet-classes.txt | grep -v '^$' | sort > /tmp/tag-classes.txt
          grep -v '^#' verify/stylesheet-classes.txt | grep -v '^$' | sort > /tmp/shipped-classes.txt
          if ! diff -u /tmp/tag-classes.txt /tmp/shipped-classes.txt > /tmp/classes.diff 2>&1; then
            echo "::error::The CSS in ${GITHUB_REF_NAME} does not match scripts/stylesheet-classes.txt, so the tag ships classes the repo does not claim."
            echo "Fix on the tag's commit, then re-tag: pnpm run build && pnpm run styles:write && commit."
            head -60 /tmp/classes.diff
            exit 1
          fi
          echo "class snapshot matches the tag ($(wc -l < /tmp/shipped-classes.txt) classes)"

      # Checksums + manifest turn "did CI and I build the same app?" into a
      # single comparison instead of eyeballing file sizes: rebuild the tag with
      # `npm run repro` and diff your rootHash against repro-manifest.json.
      - name: Write release checksums
        run: |
          cd verify
          find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\n' \
            | sort | xargs sha256sum > SHA256SUMS
          cat SHA256SUMS

      - name: Attach checksums and build manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" \
            verify/SHA256SUMS repro-manifest.json verify/stylesheet-classes.txt \
            --clobber --repo "${GITHUB_REPOSITORY}"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "${GITHUB_REF_NAME}" --draft=false --repo "${GITHUB_REPOSITORY}"
          echo "Release ${GITHUB_REF_NAME} published"
