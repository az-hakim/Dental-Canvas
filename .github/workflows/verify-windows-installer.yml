name: Verify Windows installer

# Manual, publication-free check of the Windows installer.
#
# build-packages.yml only runs on a tag and finishes by uploading to a release,
# so there is no way to inspect the installer it produces without publishing
# one. This workflow runs the same Windows build steps and uploads the result as
# a workflow artifact instead: the setup.exe, plus the installer.nsi the Tauri
# bundler generated for that build. The script is what decides whether an
# in-app update can replace a running app (Windows Restart Manager vs kill +
# sleep), so it is the thing worth looking at.
#
# Updater-artifact signing is turned off via --config, because the signing key
# is a release secret and this job deliberately has none.

on:
  workflow_dispatch:

env:
  VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
  VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Pin reproducible build environment
        shell: bash
        run: source scripts/repro-env.sh

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: The Tauri CLI ships an installer that can replace a running app
        shell: bash
        run: node scripts/check-tauri-plugin-versions.mjs

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Build the NSIS installer
        shell: bash
        run: >
          pnpm tauri build
          --target x86_64-pc-windows-msvc
          --bundles nsis
          --config '{"bundle":{"createUpdaterArtifacts":false}}'
          --verbose

      - name: Locate the generated NSIS script
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path nsis-capture | Out-Null
          $found = @()
          $found += Get-ChildItem -Path src-tauri/target -Recurse -Filter installer.nsi -ErrorAction SilentlyContinue
          $found += Get-ChildItem -Path $env:TEMP -Recurse -Filter installer.nsi -ErrorAction SilentlyContinue
          $i = 0
          foreach ($f in ($found | Sort-Object FullName -Unique)) {
            $i++
            Copy-Item $f.FullName "nsis-capture/installer-$i.nsi"
            Write-Host "captured $($f.FullName)"
          }
          if ($i -eq 0) {
            Write-Host '::error::the build produced no installer.nsi to inspect'
            exit 1
          }
          Write-Host "=== Restart Manager call sites in installer-1.nsi ==="
          Select-String -Path nsis-capture/installer-1.nsi -Pattern 'RSTRTMGR|RmStartSession|RmGetList|RmShutdown|RmEndSession|KillProcess|Sleep' |
            ForEach-Object { "{0}:{1}" -f $_.LineNumber, $_.Line.Trim() }
          Write-Host "=== app-children plugin calls ==="
          Select-String -Path nsis-capture/installer-1.nsi -Pattern 'CheckIfAppIsRunning|nsis_tauri_utils' |
            ForEach-Object { "{0}:{1}" -f $_.LineNumber, $_.Line.Trim() }

      # The scenario the bug report describes: the app is running, the updater
      # launches the installer, and the installer has to replace a mapped
      # dental-canvas.exe. The old bundle template killed the app and slept
      # 500 ms; this asserts the update finishes and the file on disk is the one
      # that was just packaged, whatever the app was doing.
      - name: Install, then update over a running app
        shell: pwsh
        run: |
          $setup = Get-ChildItem 'src-tauri\target\x86_64-pc-windows-msvc\release\bundle\nsis\*.exe' |
            Select-Object -First 1
          $dir = Join-Path $env:LOCALAPPDATA 'Dental Canvas'
          if (Test-Path $dir) { Remove-Item $dir -Recurse -Force }

          $first = Start-Process -FilePath $setup.FullName -ArgumentList '/S' -PassThru
          if (-not $first.WaitForExit(300000)) {
            $first.Kill()
            throw 'the fresh install did not finish within 300 s'
          }
          "fresh install exit code: $($first.ExitCode)"
          if ($first.ExitCode -ne 0) { throw "fresh install failed: $($first.ExitCode)" }

          $exe = Join-Path $dir 'dental-canvas.exe'
          $uninstaller = Join-Path $dir 'uninstall.exe'
          if (-not (Test-Path $exe)) { throw "installer created no $exe" }
          $builtExe = 'src-tauri/x86_64-pc-windows-msvc/release/dental-canvas.exe'
          if (-not (Test-Path $builtExe)) { $builtExe = 'src-tauri/target/x86_64-pc-windows-msvc/release/dental-canvas.exe' }
          # The bundler patches the packaged binary's resources, so compare the
          # size with the cargo output rather than a hash.
          $installed = Get-Item $exe
          $built = Get-Item $builtExe
          "installed exe: $($installed.Length) bytes, FileVersion $($installed.VersionInfo.FileVersion)"
          "cargo output: $($built.Length) bytes — same binary: $($installed.Length -eq $built.Length)"
          if ($installed.Length -ne $built.Length) { throw 'the installed exe is not the binary this job built' }
          $builtHash = (Get-FileHash $builtExe -Algorithm SHA256).Hash
          $uninstallerHash = (Get-FileHash $uninstaller -Algorithm SHA256).Hash
          $keys = Get-ChildItem 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall' |
            Where-Object { (Get-ItemProperty $_.PSPath).DisplayName -like 'Dental Canvas*' }
          "per-user uninstall key: $(if ($keys) { $keys.PSChildName } else { 'MISSING' })"

          $app = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 8
          $appWasRunning = -not $app.HasExited
          "app process alive before the update: $appWasRunning"

          # Mark a file the update has to rewrite, so "the update ran" is
          # distinguishable from "the installer started and did nothing".
          # uninstall.exe is not mapped by the running app; the exe is.
          Set-Content -Path $uninstaller -Value 'clobbered before the update' -NoNewline

          $sw = [Diagnostics.Stopwatch]::StartNew()
          $update = Start-Process -FilePath $setup.FullName -ArgumentList '/S', '/UPDATE' -PassThru
          if (-not $update.WaitForExit(240000)) {
            $update.Kill()
            throw 'the update installer did not finish within 240 s — the replace step is blocked'
          }
          $sw.Stop()
          "update exit code: $($update.ExitCode) after $([int]$sw.Elapsed.TotalSeconds)s"
          if ($update.ExitCode -ne 0) { throw "update installer failed: $($update.ExitCode)" }

          $afterHash = (Get-FileHash $uninstaller -Algorithm SHA256).Hash
          "update rewrote uninstall.exe: $($afterHash -eq $uninstallerHash)"
          if ($afterHash -ne $uninstallerHash) { throw 'the update did not write its files' }
          "app exe still this build after the update: $((Get-Item $exe).Length -eq $built.Length)"
          if ((Get-Item $exe).Length -ne $built.Length) { throw 'the update left a different app binary' }
          "app process still running after the update: $(-not $app.HasExited)"
          if ($appWasRunning -and -not $app.HasExited) {
            throw 'the app survived the update — Restart Manager did not shut it down'
          }

      - name: Upload the installer and its script
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            nsis-capture/*.nsi
          if-no-files-found: error
          retention-days: 7
